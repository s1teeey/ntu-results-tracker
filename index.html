<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NTU Results Tracker</title>
<meta name="theme-color" content="#f4f5fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NTU Results">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700;800&display=swap">
<style>
/* Layout: left sidebar (desktop) / bottom tabs (phone); sticky top bar + sticky "my results" strip;
   four tabs: overview, roster, history, log. Light theme only, pastel tiles. */
:root{
  --bg:#f4f5fb; --card:#ffffff; --ink:#14142b; --muted:#6b6f85; --line:#e8e9f2;
  --accent:#6b4eff; --accent-soft:#ece8ff; --lav:#e7e2ff; --mint:#d9f3ec; --peach:#fde5d5; --sun:#fff1c9;
  --win:#13925f; --win-bg:#dcf5ea; --wait:#a86200; --wait-bg:#fdecc8; --none:#c0392b; --none-bg:#fde3df;
  --dot:#dcdcee; --black:#14142b;
  --shadow:0 1px 2px rgba(20,20,43,.04),0 6px 18px rgba(20,20,43,.05);
  --font:"Avenir Next","Avenir","Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --topH:64px;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 16px;display:flex;flex-direction:column;gap:6px;background:var(--card);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo{width:32px;height:32px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.brand b{font-size:16px;font-weight:800;letter-spacing:-.01em}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:11px 12px;border-radius:14px;font-weight:600;color:var(--muted);cursor:pointer;text-align:left}
.nav button svg{width:20px;height:20px;flex:none}
.nav button[aria-current="page"]{background:var(--black);color:#fff}
.nav button:focus-visible,.chip:focus-visible,.dot:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.side .foot{margin-top:auto;padding:10px 8px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-family:var(--mono)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--win);box-shadow:0 0 0 0 rgba(19,146,95,.5);animation:pulse 2s infinite}
.live.off i{background:#b9bbc9;animation:none}.live.bad i{background:var(--none);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(19,146,95,0)}100%{box-shadow:0 0 0 0 rgba(19,146,95,0)}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
main{min-width:0;padding:0 28px 40px}
.top{position:sticky;top:0;z-index:20;height:calc(var(--topH) + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(244,245,251,.92);backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top,0px);margin:0 -28px;padding-left:28px;padding-right:28px}
.top h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
.top .logo{display:none}
.mine{position:sticky;top:calc(var(--topH) + env(safe-area-inset-top,0px));z-index:19;display:flex;gap:10px;padding:0 0 12px;background:linear-gradient(var(--bg) 82%,rgba(244,245,251,0))}
.mine .m{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border-radius:16px;padding:9px 14px;box-shadow:var(--shadow)}
.mine .m span:first-child{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:#eef0f7;color:var(--muted);white-space:nowrap}
.pill.win{background:var(--win-bg);color:var(--win)}.pill.wait{background:var(--wait-bg);color:var(--wait)}.pill.none{background:var(--none-bg);color:var(--none)}.pill.pre{background:#eef0f7;color:var(--muted)}
.tab{display:none;flex-direction:column;gap:16px;padding-top:6px}
.tab.on{display:flex}
.date{font-size:13px;font-weight:700;color:var(--muted);margin:6px 0 -8px}
h2.big{margin:0;font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.025em}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);min-width:0}
.pad{padding:18px 20px}
.hero{padding:22px;border-radius:24px;display:flex;flex-direction:column;gap:6px;background:var(--lav)}
.hero.watching{background:var(--mint)}.hero.found{background:var(--black);color:#fff}.hero.timeout,.hero.stale{background:var(--none-bg)}
.hero .tag{align-self:flex-start;font-size:12px;font-weight:800;letter-spacing:.06em;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.7)}
.hero.found .tag{background:rgba(255,255,255,.18)}
.hero h3{margin:6px 0 0;font-size:24px;line-height:1.3;font-weight:800;text-wrap:balance}
.hero .num{font-family:var(--mono);font-size:44px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero p{margin:0;font-size:14px;opacity:.75}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{border-radius:22px;padding:16px 18px;min-width:0}
.tile b{display:block;font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.tile span{font-size:13px;font-weight:600;color:var(--muted)}
.tile.a{background:var(--lav)}.tile.b{background:var(--mint)}.tile.c{background:var(--peach)}
.tile.cta{background:var(--black);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;text-decoration:none;text-align:center}
.tile.cta span{color:rgba(255,255,255,.7)}
.tile.cta b{font-size:18px}
.tile.cta.off{opacity:.4;pointer-events:none}
@media (max-width:820px){.tiles{grid-template-columns:1fr 1fr}.tile b{font-size:28px}}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 20px 0}
.sh h3{margin:0;font-size:17px;font-weight:800}
.tg{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:#eef0f7;color:var(--muted)}
.tg.ok{background:var(--win-bg);color:var(--win)}.tg.bad{background:var(--none-bg);color:var(--none)}
.mecards{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 20px 20px}
@media (max-width:620px){.mecards{grid-template-columns:1fr}}
.mc{border-radius:18px;padding:16px;background:var(--bg);min-width:0}
.mc .d{font-size:13px;color:var(--muted);font-weight:700}.mc .i{font-family:var(--mono);font-size:12px;color:var(--muted)}
.mc .o{font-size:30px;font-weight:800;line-height:1.2;margin:8px 0 2px;letter-spacing:-.02em}
.mc .o.win{color:var(--win)}.mc .o.wait{color:var(--wait)}.mc .o.none{color:var(--none)}.mc .o.pre{color:var(--muted)}
.mc .t{font-size:13px;color:var(--muted)}
.meter{height:10px;border-radius:99px;background:#e2e3ef;overflow:hidden;margin-top:10px}.meter b{display:block;height:100%;border-radius:99px;background:var(--accent)}.meter.g b{background:var(--win)}
.prior{display:flex;flex-direction:column;gap:12px;padding:0 20px 20px}
.pr{display:grid;grid-template-columns:110px 1fr 64px;gap:12px;align-items:center;font-size:14px;font-weight:600}
.pr .meter{margin:0}.pr .n{font-family:var(--mono);text-align:right;font-size:13px}
@media (max-width:420px){.pr{grid-template-columns:86px 1fr 56px}}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.facts>div{padding:14px 20px;border-left:1px solid var(--line)}.facts>div:first-child{border-left:0}
.k{font-size:12px;color:var(--muted);font-weight:700}
.v{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;margin-top:2px}
@media (max-width:520px){.facts{grid-template-columns:1fr 1fr}.facts>div:nth-child(3){border-left:0;border-top:1px solid var(--line)}}
.tl{position:relative;display:flex;justify-content:space-between;gap:6px;padding:22px 20px 18px}
.tl::before{content:"";position:absolute;left:44px;right:44px;top:33px;height:3px;border-radius:3px;background:var(--line)}
.tl .fill{position:absolute;left:44px;top:33px;height:3px;border-radius:3px;background:var(--accent);width:0}
.ms{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;flex:1;min-width:0}
.ms .d{width:22px;height:22px;border-radius:50%;background:var(--card);border:3px solid var(--line)}
.ms.done .d{background:var(--accent);border-color:var(--accent)}.ms.now .d{border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.ms .t{font-size:13px;font-weight:800}.ms .s{font-size:12px;color:var(--muted);font-family:var(--mono)}
.grids{display:grid;grid-template-columns:1fr 1fr}
@media (max-width:700px){.grids{grid-template-columns:1fr}}
.gcol{padding:16px 20px;min-width:0}.gcol+.gcol{border-left:1px solid var(--line)}
@media (max-width:700px){.gcol+.gcol{border-left:0;border-top:1px solid var(--line)}}
.gh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}.gh b{font-size:15px;font-weight:800}
.dots{display:grid;grid-template-columns:repeat(auto-fill,20px);gap:7px}
.dot{width:20px;height:20px;border-radius:50%;background:var(--dot);border:0;padding:0;cursor:pointer;position:relative}
.dot.dual{box-shadow:inset 0 0 0 3px var(--accent)}
.dot.win{background:#2cb585}.dot.wait{background:#f3ad43}.dot.none{background:transparent;border:2px dashed #b9bbc9}
.dot.abs{background:transparent;border:2px solid #cfd0de}.dot.abs::after{content:"";position:absolute;left:2px;right:2px;top:50%;height:2px;background:#9a9db0;transform:rotate(-45deg)}
.dot.self{background:var(--accent);outline:3px solid var(--ink);outline-offset:2px}.dot.self.win{background:#2cb585}.dot.self.wait{background:#f3ad43}
.dot.link{outline:3px solid var(--accent);outline-offset:2px}.dot.sel{outline:3px solid var(--ink);outline-offset:2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:7px}.legend i{width:12px;height:12px;border-radius:50%;background:var(--dot);display:inline-block}
.legend i.w{background:#2cb585}.legend i.t{background:#f3ad43}.legend i.d{box-shadow:inset 0 0 0 3px var(--accent)}.legend i.m{background:var(--accent);outline:2px solid var(--ink);outline-offset:1px}.legend i.n{background:transparent;border:2px dashed #b9bbc9}
.picked{padding:14px 20px;border-top:1px solid var(--line);font-size:14px;min-height:56px}
.picked .pn{font-weight:800}.picked .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.mono{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tools{display:flex;gap:10px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line)}
.tools input{flex:1;min-width:150px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:9px 16px;font:inherit}
.tools input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:99px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--black);border-color:var(--black);color:#fff}
.tw{max-height:min(62vh,560px);overflow:auto;border-radius:0 0 22px 22px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
th{position:sticky;top:0;z-index:2;background:var(--card);text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{position:sticky;left:0;z-index:1;background:var(--card)}th:first-child{z-index:3}
tr.self td{background:var(--accent-soft)}
.hist{display:flex;flex-direction:column;gap:24px;padding:16px 20px 20px}
.hh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.hh b{font-size:15px;font-weight:800}
.strip{position:relative;display:flex;gap:3px;height:26px}.strip i{flex:1;border-radius:4px;background:var(--accent)}
.strip .you{position:absolute;top:-9px;transform:translateX(-50%);font-size:11px;line-height:1}
.yrs{position:relative;height:34px;margin-top:3px}
.yrs span{position:absolute;top:0;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;line-height:1.15;white-space:pre}
.yrs span::before{content:"";display:block;width:1px;height:6px;background:#9a9db0;margin:0 auto 2px}
ul.log{list-style:none;margin:0;padding:6px 0 10px}
ul.log li{display:grid;grid-template-columns:auto 1fr;gap:16px;padding:10px 20px;border-top:1px solid var(--line);font-size:14px}ul.log li:first-child{border-top:0}
ul.log time{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;padding-top:2px}
.empty{color:var(--muted);padding:16px 20px;margin:0}
a{color:var(--accent);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:99px;padding:12px 22px;font-weight:800;cursor:pointer;text-decoration:none;background:var(--black);color:#fff}
.btn.ghost{background:#eef0f7;color:var(--ink)}
.bottom{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding:0 16px calc(88px + env(safe-area-inset-bottom,0px))}
  .top{margin:0 -16px;padding-left:16px;padding-right:16px}
  .top .logo{display:grid}
  .bottom{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottom button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
  .bottom button svg{width:22px;height:22px}
  .bottom button[aria-current="page"]{color:var(--accent)}
  h2.big{font-size:28px}
  .hero .num{font-size:34px}
}
/* modal */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(20,20,43,.55)}
.modal[hidden]{display:none}
.sheet{width:min(460px,100%);background:var(--card);border-radius:28px;padding:28px 24px 22px;box-shadow:0 20px 60px rgba(20,20,43,.35);text-align:center}
.sheet .ic{width:64px;height:64px;border-radius:20px;background:var(--win-bg);color:var(--win);display:grid;place-items:center;margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font-size:28px;font-weight:800;letter-spacing:-.02em}
.sheet p{margin:0;color:var(--muted)}
.sheet .res{display:flex;flex-direction:column;gap:8px;margin:18px 0}
.sheet .res div{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border-radius:14px;padding:10px 14px;font-weight:700}
.sheet .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="導覽">
    <div class="brand"><div class="logo">N</div><b>NTU Results</b></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><span class="live" id="liveS"><i></i><span class="lt">live</span></span><span id="syncS">—</span></div>
  </aside>
  <main>
    <header class="top">
      <div style="display:flex;align-items:center;gap:10px;min-width:0"><div class="logo">N</div><h1 id="pageTitle">總覽</h1></div>
      <span class="live" id="liveT"><i></i><span class="lt">live</span></span>
    </header>
    <div class="mine" id="mine" aria-label="我的結果"></div>

    <section class="tab" id="tab-overview">
      <div class="date" id="dateLine"></div>
      <h2 class="big">116 甄試放榜</h2>
      <div class="hero" id="hero" aria-live="polite"><span class="tag" id="heroTag">讀取中</span><h3 id="heroH">正在連線…</h3><div class="num" id="heroN" hidden></div><p id="heroP"></p></div>
      <div class="tiles" id="tiles"></div>
      <div class="card"><div class="tl" id="tl"></div></div>
      <div class="card">
        <div class="sh"><h3>我的結果</h3><span class="tg" id="meTag">朱O冠</span></div>
        <div class="mecards" id="meBoxes"></div>
        <div class="prior" id="prior"></div>
      </div>
      <div class="card" id="validCard" hidden></div>
      <div class="card facts"><div><div class="k">最後回報</div><div class="v" id="fBeat">—</div></div><div><div class="k">檢查次數</div><div class="v" id="fChecks">—</div></div><div><div class="k">開始時間</div><div class="v" id="fStart">—</div></div></div>
    </section>

    <section class="tab" id="tab-roster">
      <h2 class="big">一階名冊</h2>
      <div class="card">
        <div class="sh"><h3>名冊圓點</h3><span class="tg" id="rosterTag">—</span></div>
        <div class="grids">
          <div class="gcol"><div class="gh"><b>商研所</b><span class="k" id="gB"></span></div><div class="dots" id="dB"></div></div>
          <div class="gcol"><div class="gh"><b>國企</b><span class="k" id="gI"></span></div><div class="dots" id="dI"></div></div>
        </div>
        <div class="legend" id="legend"></div>
        <div class="picked" id="picked"></div>
      </div>
      <div class="card">
        <div class="sh"><h3>全體考生</h3><span class="tg" id="tblTag">—</span></div>
        <div class="tools"><input id="q" type="search" placeholder="姓名或准考證" autocomplete="off" aria-label="搜尋"><div class="chips" id="chips"></div></div>
        <div class="tw"><table><thead><tr><th>姓名</th><th>商研所</th><th>國企</th><th>財金</th></tr></thead><tbody id="tb"></tbody></table></div>
      </div>
    </section>

    <section class="tab" id="tab-history">
      <h2 class="big">歷年遞補</h2>
      <div class="card"><div class="sh"><h3>遞補到備取第幾順位</h3><span class="tg">112–115</span></div><div class="hist" id="hist"></div></div>
    </section>

    <section class="tab" id="tab-log">
      <h2 class="big">工作紀錄</h2>
      <div class="card"><ul class="log" id="log"></ul><p class="empty" id="logEmpty">尚無紀錄</p></div>
      <div class="card pad"><div class="k">資料來源</div><div class="v" id="srcInfo">—</div></div>
    </section>
  </main>
  <nav class="bottom" id="bottom" aria-label="分頁"></nav>
</div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="sheet">
    <div class="ic"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h3 id="mTitle">已放榜</h3>
    <p id="mSub">第 2 梯次榜單已出現</p>
    <div class="res" id="mRes"></div>
    <div class="acts"><button class="btn" id="mOk" type="button">確認</button><a class="btn ghost" id="mLink" href="#" target="_blank" rel="noopener" hidden>開啟榜單 PDF</a></div>
  </div>
</div>

<script>
(function(){
"use strict";
